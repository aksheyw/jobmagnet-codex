<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="360" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">What happens inside the engine room on one job</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E5F"/>
    </marker>
  </defs>

  <!-- the website -->
  <rect x="20" y="140" width="150" height="64" rx="10" fill="#F3F5F9" stroke="#B9BEC6"/>
  <text x="95" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">jobmagnet-app</text>
  <text x="95" y="187" text-anchor="middle" font-size="11.5" fill="#5B6169">sends the job</text>

  <line x1="170" y1="172" x2="214" y2="172" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- this repo -->
  <rect x="200" y="62" width="500" height="200" rx="12" fill="#E6F4F1" stroke="#0E9384"/>
  <text x="450" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0B6E5F">jobmagnet-codex (this repo): a Docker server on a VPS</text>

  <rect x="216" y="140" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="264" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Gatekeeper</text>
  <text x="264" y="181" text-anchor="middle" font-size="11" fill="#5B6169">checks the key</text>
  <text x="264" y="196" text-anchor="middle" font-size="11" fill="#5B6169">and job link</text>

  <line x1="312" y1="172" x2="326" y2="172" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="328" y="140" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="376" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Research</text>
  <text x="376" y="181" text-anchor="middle" font-size="11" fill="#5B6169">reads the job,</text>
  <text x="376" y="196" text-anchor="middle" font-size="11" fill="#5B6169">(web search)</text>

  <line x1="424" y1="160" x2="438" y2="122" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="424" y1="172" x2="438" y2="172" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="424" y1="184" x2="438" y2="222" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="100" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="505" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Brand</text>
  <text x="505" y="135" text-anchor="middle" font-size="11" fill="#5B6169">colors and fonts</text>

  <rect x="440" y="150" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="505" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Narrative</text>
  <text x="505" y="185" text-anchor="middle" font-size="11" fill="#5B6169">candidate's story</text>

  <rect x="440" y="200" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="505" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Pitch (optional)</text>
  <text x="505" y="235" text-anchor="middle" font-size="11" fill="#5B6169">a product critique</text>

  <text x="505" y="256" text-anchor="middle" font-size="10.5" fill="#5B6169">these three run at the same time</text>

  <line x1="570" y1="122" x2="586" y2="160" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="172" x2="586" y2="172" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="222" x2="586" y2="184" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="588" y="140" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="636" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Code</text>
  <text x="636" y="181" text-anchor="middle" font-size="11" fill="#5B6169">fills the site,</text>
  <text x="636" y="196" text-anchor="middle" font-size="11" fill="#5B6169">zips it, no AI</text>

  <line x1="684" y1="172" x2="728" y2="172" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the output -->
  <rect x="730" y="140" width="150" height="64" rx="10" fill="#F3F5F9" stroke="#B9BEC6"/>
  <text x="805" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">A signed link</text>
  <text x="805" y="187" text-anchor="middle" font-size="11.5" fill="#5B6169">stored for the zip</text>

  <!-- telemetry -->
  <line x1="450" y1="262" x2="450" y2="294" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="296" width="300" height="48" rx="10" fill="#F3F5F9" stroke="#B9BEC6"/>
  <text x="450" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A4A">Supabase: a usage log</text>
  <text x="450" y="334" text-anchor="middle" font-size="11" fill="#5B6169">tokens and time of agent calls</text>
</svg>
